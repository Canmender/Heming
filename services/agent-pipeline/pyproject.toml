[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-pipeline"
version = "0.1.0"
description = "和鸣多智能体流水线：Plan/Execute/Reflect + LangGraph 编排 + Prometheus + 自动回滚"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5"]

[project.scripts]
agent-pipeline = "agent_pipeline.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# 覆盖率门槛：低于 90% 直接失败（当前 94%，留 4 个点的余量给重构期）。
# 日常用 `pytest --cov --cov-report=term-missing`；CI 用 `pytest --cov --cov-fail-under=90`。
[tool.coverage.run]
source = ["agent_pipeline"]

[tool.coverage.report]
fail_under = 90
skip_covered = true
show_missing = true