groups:
  - name: agent-pipeline
    rules:
      # 错误率：5 分钟内失败占比 > 20%（与 Settings.error_threshold 同口径）。
      - alert: PipelineErrorRateHigh
        expr: |
          sum(rate(pipeline_runs_total{status!="ok"}[5m]))
            /
          clamp_min(sum(rate(pipeline_runs_total[5m])), 0.001) > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "智能体流水线错误率超过 20%"
          description: "5 分钟窗口内非 ok 状态占比 {{ $value | humanizePercentage }}，检查 /v1/config 是否已自动回滚、以及更新源/模型是否可用。"

      # 端到端 P95 超过 120 秒（与 Settings.latency_threshold_s 同口径）。
      - alert: PipelineLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(pipeline_run_duration_seconds_bucket[10m])) by (le)) > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "智能体流水线 P95 耗时超过 120s"
          description: "P95 = {{ $value }}s；先看 pipeline_node_duration_seconds 是哪个节点慢（plan/execute/reflect/critic/adversarial）。"

      # 工具失败率：单个工具 5 分钟内失败占比 > 30%。
      # 带标签的 counter 第一次自增前不会出现在 /metrics 里：外层 `or vector(0)`
      # 让「零工具流量」是 0 而不是 no data（否则开了 nodata 处理的告警会误报/哑掉）。
      - alert: ToolFailureRateHigh
        expr: |
          (
            (
              sum by (tool) (rate(pipeline_tool_calls_total{status="error"}[5m]))
                /
              # 分母只算「真的执行过」的调用：cached 是幂等缓存命中、零风险，
              # 混进分母会把失败率稀释掉（每次都失败但常命中的工具会永远不告警）。
              clamp_min(sum by (tool) (rate(pipeline_tool_calls_total{status=~"ok|error"}[5m])), 0.001)
            )
            or vector(0)
          ) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "工具 {{ $labels.tool }} 失败率超过 30%"
          description: "先看 run 日志里的 observation error 字段；连续失败会被 ToolRuntime 断路器切断冷却 30s。"

      # 连续回滚说明当前候选配置有问题。同样用 `or vector(0)` 保证没有回滚时是 0 而不是 no data。
      - alert: PipelineRollbackSpike
        expr: (increase(pipeline_rollback_total[1h]) or vector(0)) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "过去 1 小时发生了自动回滚"
          description: "回滚原因见 pipeline_rollback_total 的 reason 标签；需人工确认候选配置并考虑 pin 住旧版本。"

      # 服务活着但一条 run 都没跑完：多半是没人用、或者提交路径坏了（比 Down 更容易漏）。
      - alert: PipelineNoCompletedRuns
        expr: up{job="agent-pipeline"} == 1 and absent(pipeline_runs_total)
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "服务在线但 30 分钟没有一次 run 结束"
          description: "如果确实有人在用，检查 POST /v1/runs 是否 429（并发满）或上游模型一直挂住。"

      # 服务本身挂掉（Prometheus 抓不到）。
      - alert: AgentPipelineDown
        expr: up{job="agent-pipeline"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "agent-pipeline 抓取失败"
          description: "容器可能已退出：docker compose ps / docker compose logs agent-pipeline。"

      # run 日志写失败：run 照常返回，但 tune/回滚窗口读的就是这份日志。
      # 静默失败会让人拿着空日志出「0 个失败样本」的报告，必须让人知道。
      - alert: PipelineLogWriteFailing
        expr: (increase(pipeline_log_failures_total[10m]) or vector(0)) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "10 分钟内 run 日志写入失败 {{ $value }} 次"
          description: "看 /health 的 log_last_error（权限/磁盘/路径变了）；不修的话每日调优读不到数据，只会出一份空报告。"

      # 每日调优连续失败：候选生成/评测有 bug 时，流水线不会自己变好，也不会告警。
      - alert: PipelineTuneFailing
        expr: (increase(pipeline_tune_runs_total{status="error"}[6h]) or vector(0)) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "每日调优最近 6 小时有失败"
          description: "看 /health 的 tuner.last_error 与调优报告；日志格式变了/评测器起不来都会落到这里。"

      # 覆盖率长期不达标（对抗模式的核心目标）。
      - alert: CoverageBelowTarget
        expr: pipeline_coverage_ratio > 0 and pipeline_coverage_ratio < 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "最近一次对抗迭代覆盖率 {{ $value }} 低于目标 0.9"
          description: "看 run 日志里 adversarial_round / blocking_issues；tester 报的 bug 应逐条转成测试用例。"