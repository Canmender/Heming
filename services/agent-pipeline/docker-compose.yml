# 一键起「流水线 + Prometheus + 告警看板」。
#
#   export AGENT_PIPELINE_API_KEY=sk-...        # 上游模型（DeepSeek 等）的 Key
#   export AGENT_SERVICE_TOKEN=换成随机串        # 这个服务自己的入站令牌（强烈建议设）
#   docker compose up --build
#
# 服务 http://localhost:8000（/metrics 给 Prometheus 抓），Prometheus http://localhost:9090。
# 本机没装 docker 时这份文件只作交付物，构建/联调需在有 Docker 的机器上做。
services:
  agent-pipeline:
    build: .
    image: agent-pipeline:0.1.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AGENT_PIPELINE_API_KEY: ${AGENT_PIPELINE_API_KEY:?需要设置 AGENT_PIPELINE_API_KEY}
      AGENT_PIPELINE_MODEL: ${AGENT_PIPELINE_MODEL:-deepseek-chat}
      AGENT_PIPELINE_BASE_URL: ${AGENT_PIPELINE_BASE_URL:-https://api.deepseek.com}
      # 变量名以代码为准（config.Settings.from_env 读的就是这些）：
      AGENT_CANARY_RATIO: ${AGENT_CANARY_RATIO:-0.1}
      AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-4}
      # 日志与 SQLite 放进命名卷，重建容器不丢调优输入和灰度/回滚历史。
      AGENT_LOG_PATH: /app/data/runs.jsonl
      AGENT_PIPELINE_DB: /app/data/agent-pipeline.db
      # 每日调优：默认关；打开后服务起来先跑一轮，之后每 24h 一轮。
      AGENT_TUNE_ENABLED: ${AGENT_TUNE_ENABLED:-0}
      AGENT_TUNE_INTERVAL_S: ${AGENT_TUNE_INTERVAL_S:-86400}
      AGENT_TUNE_WINDOW_HOURS: ${AGENT_TUNE_WINDOW_HOURS:-24}
      AGENT_TUNE_OUT: /app/data/tune-report.json
      # 打开后每天真评一次（2 × 20 次流水线）；不开则只出报告，永不注册灰度。
      AGENT_TUNE_EVAL: ${AGENT_TUNE_EVAL:-0}
      AGENT_APPROVAL_MODE: ${AGENT_APPROVAL_MODE:-off}
      AGENT_APPROVAL_TIMEOUT_S: ${AGENT_APPROVAL_TIMEOUT_S:-300}
      # 入站鉴权（与上游模型的 AGENT_PIPELINE_API_KEY 不是一回事）：设了就要求
      # Authorization: Bearer <token>。暴露到 0.0.0.0 时不给等于谁都能提交 run。
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      # http_get 访问内网/本机（默认关；开的理由见 README「网络出口」）。
      AGENT_ALLOW_PRIVATE_HOSTS: ${AGENT_ALLOW_PRIVATE_HOSTS:-0}
    volumes:
      - pipeline-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - agent-pipeline

volumes:
  pipeline-data:
  prometheus-data: