<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>信息中枢</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f4f1;
        --surface: #ffffff;
        --panel: #faf9f6;
        --subtle: #f1f0ec;
        --subtle-2: #f3f2ee;
        --bubble: #f2f1ed;
        --bubble-self: #e9f0fb;
        --line: #e3e1db;
        --line-soft: #ecebe5;
        --line-strong: #c9c6be;
        --ink: #1b1a17;
        --body: #3d3b35;
        --muted: #7b786f;
        --on-ink: #ffffff;
        --warn: #a15c00;
        --warn-soft: #fbf1e1;
        --danger: #b42318;
        --danger-soft: #fdf2f0;
        --success: #067647;
        --success-soft: #ecf8f1;
        --shadow: 0 1px 2px rgba(24, 22, 18, 0.05), 0 8px 24px rgba(24, 22, 18, 0.04);
        --radius: 10px;
        --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #141312;
        --surface: #1d1c1a;
        --panel: #191816;
        --subtle: #262420;
        --subtle-2: #232220;
        --bubble: #272522;
        --bubble-self: #1b2a3d;
        --line: #34312b;
        --line-soft: #2a2824;
        --line-strong: #4b4740;
        --ink: #f3f1ea;
        --body: #d8d4ca;
        --muted: #948f83;
        --on-ink: #171613;
        --warn: #e3a34d;
        --warn-soft: #2d2415;
        --danger: #f0897c;
        --danger-soft: #2f1d1a;
        --success: #67d29b;
        --success-soft: #15291f;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.55 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
      }
      .hidden {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .micro {
        font-size: 11px;
        line-height: 1.5;
        color: var(--muted);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ── 页头 ── */
      #app-header {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 11px 20px 9px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--surface);
      }
      .title-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .title-wrap h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        flex: none;
        border-radius: 50%;
        background: var(--line-strong);
      }
      .status-dot[data-state="ready"] {
        background: var(--success);
      }
      .status-dot[data-state="error"] {
        background: var(--danger);
      }
      .status-dot[data-state="busy"] {
        background: var(--warn);
      }
      .status-line {
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
      }
      .subtitle {
        flex: 1 1 220px;
        min-width: 0;
        overflow: hidden;
        font-size: 11.5px;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }

      /* ── 按钮 / 输入 ── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--body);
        font-size: 12px;
        line-height: 1.5;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
      }
      .btn:hover:not(:disabled) {
        background: var(--subtle);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn-primary {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--on-ink);
      }
      .btn-primary:hover:not(:disabled) {
        opacity: 0.88;
        background: var(--ink);
      }
      .btn-ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn-ghost:hover:not(:disabled) {
        background: var(--subtle);
      }
      .btn-danger {
        border-color: transparent;
        background: transparent;
        color: var(--danger);
      }
      .btn-sm {
        padding: 2px 8px;
        font-size: 11.5px;
      }
      .link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--body);
        font-size: 11.5px;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .link:hover {
        color: var(--ink);
      }
      .link:disabled {
        opacity: 0.4;
        cursor: default;
        text-decoration: none;
      }
      .input {
        width: 100%;
        min-width: 0;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        outline: none;
        transition: border-color 120ms ease;
      }
      .input:focus {
        border-color: var(--ink);
      }
      .input::placeholder {
        color: var(--muted);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--muted);
        font-size: 10.5px;
        line-height: 17px;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0 5px;
        border-radius: 4px;
        font-size: 10.5px;
        font-weight: 550;
        line-height: 16px;
        white-space: nowrap;
      }
      .badge-ok {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge-bad {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .badge-warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      /* ── 主体 ── */
      #main {
        display: flex;
        flex: 1;
        min-height: 0;
        flex-direction: column;
      }
      #error-bar {
        flex: none;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 7px 20px;
        border-bottom: 1px solid var(--danger-soft);
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 11.5px;
      }
      #error-bar span {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
      }
      #error-close {
        flex: none;
        border: 0;
        background: none;
        color: inherit;
        font-size: 11.5px;
        cursor: pointer;
      }

      #stats {
        display: flex;
        flex: none;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 20px;
        border-bottom: 1px solid var(--line-soft);
      }
      .stat {
        flex: 1 1 0;
        min-width: 88px;
        padding: 6px 10px;
        border: 1px solid var(--line-soft);
        border-radius: 9px;
        background: var(--surface);
      }
      .stat-label {
        overflow: hidden;
        color: var(--muted);
        font-size: 10.5px;
        letter-spacing: 0.04em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .stat-value {
        margin-top: 1px;
        overflow: hidden;
        font-size: 15px;
        font-weight: 620;
        font-variant-numeric: tabular-nums;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #sources {
        flex: none;
        padding: 7px 20px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--panel);
        font-size: 11.5px;
      }
      .source-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 14px;
      }
      .source-label {
        font-weight: 550;
        color: var(--body);
      }
      .source-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .source-paths {
        margin: 6px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
        list-style: none;
      }
      .source-paths li {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 10.5px;
      }
      .source-paths .path-name {
        width: 86px;
        flex: none;
        color: var(--muted);
      }
      .source-paths code {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--subtle);
        font-size: 10.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .source-note {
        margin: 5px 0 0;
        color: var(--body);
        font-size: 10.5px;
      }

      #sync-panel {
        flex: none;
        padding: 9px 20px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--panel);
      }
      .sync-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px 14px;
        font-size: 11.5px;
      }
      .sync-row label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      .sync-row label:has(input:disabled) {
        cursor: default;
        opacity: 0.55;
      }
      .sync-row input {
        margin: 0;
        accent-color: var(--ink);
      }
      .sync-tip {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 10.5px;
      }
      .progress {
        height: 4px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--line-soft);
      }
      .progress > i {
        display: block;
        width: 34%;
        height: 100%;
        border-radius: 999px;
        background: var(--ink);
        animation: indet 1.2s ease-in-out infinite;
      }
      @keyframes indet {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(330%);
        }
      }

      #tabs {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 7px 20px;
        border-bottom: 1px solid var(--line-soft);
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 12px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }
      .tab:hover {
        background: var(--subtle);
      }
      .tab[aria-selected="true"] {
        background: var(--subtle);
        color: var(--ink);
        font-weight: 550;
      }
      .tab-count {
        padding: 0 5px;
        border-radius: 999px;
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 10px;
        font-weight: 600;
      }
      .source-status {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-left: auto;
        color: var(--muted);
        font-size: 10.5px;
      }

      #tab-content {
        display: flex;
        flex: 1;
        min-height: 0;
        flex-direction: column;
      }
      .tab-pane {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .tab-pane-chats {
        display: flex;
        overflow: hidden;
      }

      /* ── 检索 ── */
      .search-form {
        display: flex;
        flex: none;
        gap: 8px;
        padding: 11px 20px;
        border-bottom: 1px solid var(--line-soft);
      }
      .search-form .input {
        flex: 1;
      }
      .search-body {
        padding: 11px 20px 20px;
      }
      .hit-summary {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 10.5px;
      }
      .hit-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .hit {
        padding: 7px 10px;
        border: 1px solid var(--line-soft);
        border-radius: 9px;
        background: var(--surface);
      }
      .hit-meta {
        display: flex;
        align-items: baseline;
        gap: 8px;
        color: var(--muted);
        font-size: 10.5px;
      }
      .hit-conv {
        overflow: hidden;
        color: var(--body);
        font-weight: 550;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hit-time {
        margin-left: auto;
        flex: none;
      }
      .hit-text {
        margin-top: 3px;
        color: var(--ink);
        font-size: 12.5px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .hit-sender {
        color: var(--muted);
      }
      .hit mark {
        padding: 0 1px;
        border-radius: 2px;
        background: var(--warn-soft);
        color: var(--ink);
      }

      /* ── 会话 ── */
      .conv-pane {
        display: flex;
        width: 300px;
        flex: none;
        flex-direction: column;
        border-right: 1px solid var(--line-soft);
      }
      .conv-toolbar {
        display: flex;
        flex: none;
        flex-direction: column;
        gap: 7px;
        padding: 10px;
        border-bottom: 1px solid var(--line-soft);
      }
      .segment {
        display: flex;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .segment button {
        flex: 1;
        padding: 3px 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 11.5px;
        cursor: pointer;
      }
      .segment button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      .conv-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 10.5px;
      }
      .conv-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .conv-item {
        display: flex;
        width: 100%;
        align-items: flex-start;
        gap: 9px;
        padding: 8px 10px;
        border: 0;
        border-bottom: 1px solid var(--line-soft);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .conv-item:last-child {
        border-bottom: 0;
      }
      .conv-item:hover {
        background: var(--subtle);
      }
      .conv-item[aria-current="true"] {
        background: var(--subtle);
      }
      .avatar {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--line-strong);
        color: #fff;
        font-size: 11.5px;
        font-weight: 600;
      }
      .avatar-lg {
        width: 30px;
        height: 30px;
      }
      .avatar-sm {
        width: 26px;
        height: 26px;
        font-size: 10.5px;
      }
      .conv-main {
        display: block;
        min-width: 0;
        flex: 1;
      }
      .conv-title-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .conv-name {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .conv-time {
        flex: none;
        color: var(--muted);
        font-size: 10.5px;
      }
      .conv-sub {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 1px;
        color: var(--muted);
        font-size: 10.5px;
      }
      .conv-more {
        padding: 8px 10px;
      }

      .msg-pane {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
      }
      .msg-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: 7px;
        padding: 7px 14px;
        border-bottom: 1px solid var(--line-soft);
      }
      .msg-head-name {
        min-width: 0;
        overflow: hidden;
        font-size: 12.5px;
        font-weight: 550;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .msg-stream {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px 0 14px;
      }
      .day-sep {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 14px 4px;
        color: var(--muted);
        font-size: 10.5px;
      }
      .day-sep::before,
      .day-sep::after {
        height: 1px;
        flex: 1;
        background: var(--line-soft);
        content: "";
      }
      .msg {
        display: flex;
        gap: 7px;
        margin-top: 10px;
        padding: 0 14px;
      }
      .msg.self {
        justify-content: flex-end;
      }
      .msg.merged {
        margin-top: 2px;
      }
      .msg .avatar {
        margin-top: 1px;
      }
      .msg-body {
        display: flex;
        max-width: 72%;
        flex-direction: column;
      }
      .msg.self .msg-body {
        align-items: flex-end;
      }
      .msg-meta {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 10.5px;
      }
      .bubble {
        padding: 6px 10px;
        border-radius: 9px;
        background: var(--bubble);
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .msg.self .bubble {
        background: var(--bubble-self);
      }
      .msg-type {
        margin-top: 3px;
      }

      /* ── 日程 ── */
      .agenda-head {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 14px;
        padding: 9px 20px;
        border-bottom: 1px solid var(--line-soft);
        color: var(--muted);
        font-size: 11.5px;
      }
      .agenda-summary {
        display: flex;
        gap: 10px;
        font-size: 10.5px;
      }
      .agenda-summary .overdue {
        color: var(--danger);
      }
      .agenda-body {
        padding: 11px 20px 20px;
      }
      .agenda-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .agenda-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 7px 10px;
        border: 1px solid var(--line-soft);
        border-radius: 9px;
        background: var(--surface);
      }
      .due {
        flex: none;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--subtle-2);
        color: var(--body);
        font-size: 10px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .due.overdue {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .agenda-main {
        min-width: 0;
        flex: 1;
      }
      .agenda-title {
        overflow: hidden;
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .agenda-detail {
        margin-top: 1px;
        overflow: hidden;
        display: -webkit-box;
        color: var(--muted);
        font-size: 11.5px;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .agenda-source {
        margin-top: 2px;
        color: var(--muted);
        font-size: 10.5px;
      }

      /* ── 空态 / 骨架 / 进度 ── */
      .empty {
        display: flex;
        min-height: 100%;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 32px;
        color: var(--muted);
        text-align: center;
      }
      .empty-title {
        color: var(--body);
        font-size: 13.5px;
        font-weight: 600;
      }
      .empty-desc {
        max-width: 380px;
        font-size: 11.5px;
        line-height: 1.6;
      }
      .skeleton {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
      }
      .skeleton-row {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .skeleton-line {
        height: 9px;
        border-radius: 999px;
        background: var(--subtle);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      #state-panel {
        display: flex;
        flex: 1;
        min-height: 0;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding: 24px;
      }
      .state-card {
        width: min(460px, 100%);
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
        text-align: center;
      }
      .state-card h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 620;
      }
      .state-card p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .state-card .btn {
        margin-top: 14px;
      }

      #config-details {
        flex: none;
        max-height: 168px;
        overflow-y: auto;
        padding: 7px 20px;
        border-top: 1px solid var(--line-soft);
        background: var(--panel);
        font-size: 11px;
      }
      #config-details summary {
        color: var(--body);
        font-size: 11px;
        cursor: pointer;
      }
      .config-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 2px 20px;
        margin-top: 7px;
        color: var(--muted);
        font-size: 10.5px;
      }
      .config-path {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 10.5px;
        overflow-wrap: anywhere;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 999px;
        background-clip: content-box;
        background-color: var(--line-strong);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--muted);
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <div class="title-wrap">
          <span id="status-dot" class="status-dot" data-state="idle" aria-hidden="true"></span>
          <h1 id="title">信息中枢</h1>
          <span id="status-line" class="status-line">正在连接…</span>
        </div>
        <div id="subtitle" class="subtitle">QQ / 微信归档只在本机处理</div>
        <div id="actions" class="actions"></div>
      </header>

      <div id="error-bar" class="hidden" role="alert">
        <span id="error-text"></span>
        <button id="error-close" type="button">关闭</button>
      </div>

      <main id="main">
        <section id="state-panel" class="hidden"></section>
        <section id="stats" class="hidden"></section>
        <section id="sources" class="hidden"></section>
        <section id="sync-panel" class="hidden"></section>
        <nav id="tabs" class="hidden" role="tablist" aria-label="信息中枢页签"></nav>
        <div id="tab-content" class="hidden">
          <section id="tab-search" class="tab-pane hidden" role="tabpanel" aria-label="检索"></section>
          <section id="tab-chats" class="tab-pane tab-pane-chats hidden" role="tabpanel" aria-label="会话"></section>
          <section id="tab-agenda" class="tab-pane hidden" role="tabpanel" aria-label="日程"></section>
        </div>
        <details id="config-details" class="hidden"></details>
      </main>
    </div>
    <!-- CSP 的 script-src 只放 'self'：脚本必须外置 -->
    <script src="app.js"></script>
  </body>
</html>
