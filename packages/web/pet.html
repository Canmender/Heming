<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠</title>
    <style>
      /*
        独立入口的最小样式：桌宠窗口**刻意不引 index.css**——
        那里面是 Tailwind 的全量 preflight 与主题变量，为整个应用准备，
        而桌宠是全透明的独立画布，只需要"页面本身不占位、不染色"。
        少一份 CSS 也让这个常驻窗口的启动更轻。
      */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* 透明窗口里滚动条会画出灰边，直接隐藏 */
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pet.tsx"></script>
  </body>
</html>
