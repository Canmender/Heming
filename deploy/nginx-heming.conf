# 和鸣裸机部署 · nginx 站点（装到 /etc/nginx/sites-available/heming）
#
# 与 docker/web-nginx.conf 同源，三处不同：
#   root     镜像内 /usr/share/nginx/html → 宿主机 /opt/heming/app/packages/web/dist
#   api      compose 服务名 `api` → 127.0.0.1:8787（api 进程只绑回环，见 /etc/heming/api.env）
#   updates  容器挂载点 → 宿主目录本尊
#
# 改这份时同步看 docker/web-nginx.conf 的两条硬约束（仍然成立）：
#   ① `/updates/` 必须排在 `location /` 之前，否则 try_files 会把 latest.yml 回落成
#      index.html，客户端拿到 HTML 报「解析更新信息失败」——界面上无声无息，极难排查；
#   ② WS 必须 HTTP/1.1 + Upgrade/Connection 透传，且 `= /api/ws` 用精确匹配。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # JSON 里内嵌 base64 文件（限 8MB）走 10m 上限即可
    client_max_body_size 10m;

    # ── CSP 基线（P0-6）───────────────────────────────────────────────────────
    #
    # 交付形态有两处设头：云端就是这里；桌面端在 app:// 协议响应头里（见
    # packages/desktop/app-protocol.js）。vite dev 不设头——dev 下插件会注入内联
    # preamble，设头会把 HMR 弄挂，而 dev 不是交付形态。
    #
    # 为什么这些来源必须放通（详见 docs/deploy.md「CSP 基线」）：
    # - connect-src 的 https:/wss: 与 127.0.0.1 / localhost 回环：
    #   模型供应商 baseUrl、MCP HTTP 服务、插件 Registry 都由用户在运行期配置，
    #   静态头无法枚举；这里只挡「远程明文 http」的供应商（请上 https 或加来源）。
    # - script-src 的 'wasm-unsafe-eval'：shiki 代码高亮（oniguruma wasm）、pdfjs 图像解码、
    #   Live2D cubism core 都需要 WASM 编译；它不放开 eval/new Function。
    # - style-src 'unsafe-inline'：KaTeX 渲染输出自带 style 属性、React 内联样式、
    #   图表样式——既成事实。script-src 绝不加 unsafe-inline / unsafe-eval。
    # - worker-src blob:：pdfjs 的 module worker；img/media blob:：录音与附件预览。
    #
    # 灰度：先 report-only 观察一轮；控制台无违例后把下面两段注释互换（只换头名），
    # 再 nginx -s reload。本文件默认启用 report-only。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' ws://$host wss://$host https: wss: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # （enforce）确认无违例后启用下面这行、注释上面那行：
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' ws://$host wss://$host https: wss: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css
               application/javascript
               text/javascript
               application/json
               image/svg+xml
               text/plain;

    root /opt/heming/app/packages/web/dist;
    index index.html;

    # WS：精确匹配握手路径（WS 连接恒为 GET /api/ws，查询串不参与匹配），
    # 与 /api/ 前缀并存时 = 精确匹配优先级最高。注意后端也只认 /api/ws。
    location = /api/ws {
        # 关掉该 location 的访问日志（d.30 · P0-3）：WS 握手 URL 可能带 token
        # （旧客户端仍走 query 兼容路径），access_log 会把完整 query 落进
        # /var/log/nginx/access.log —— 那等于把用户凭据写进日志文件。
        # location 级的 access_log off 优先级高于 server 块，无需改主 nginx.conf。
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 反代：proxy_pass 不带 URI，原样透传请求路径与查询串
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 自动更新源：/updates/latest.yml 与安装包（scripts/publish-update.sh 传到这里）
    location /updates/ {
        alias /opt/heming/updates/;
        autoindex off;

        # electron-updater 靠 Content-Length 与 Range 断点续传，
        # 这两个头不能被 gzip 改写，也不该设缓存（发新版必须立刻生效）
        default_type application/octet-stream;
        add_header Cache-Control "no-store";

        # .exe 与 .blockmap 绝不能压缩：Range 响应与压缩组合会让差分更新算错哈希
        gzip off;
    }

    # SPA：真实文件直接给，其余回落 index.html（前端路由自管）
    location / {
        try_files $uri /index.html;
    }
}
