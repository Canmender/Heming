# 和鸣 Web：nginx 静态托管 + /api 与 WS 反代（打进 web 镜像的 default.conf）
server {
    listen 80;
    server_name _;

    # JSON 里内嵌 base64 文件（限 8MB）走 10m 上限即可
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css
               application/javascript
               text/javascript
               application/json
               image/svg+xml
               text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # WS：精确匹配握手路径（WS 连接恒为 GET /api/ws，查询串不参与匹配），
    # 与 /api/ 前缀并存时 = 精确匹配优先级最高。注意后端也只认 /api/ws。
    # 必须 HTTP/1.1 + Upgrade/Connection 透传，读超时放大避免空闲断连。
    location = /api/ws {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 反代：proxy_pass 不带 URI，原样透传请求路径与查询串
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA：真实文件直接给，其余回落 index.html（前端路由自管）
    location / {
        try_files $uri /index.html;
    }
}
