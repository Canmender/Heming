# 和鸣 Web：nginx 静态托管 + /api 与 WS 反代（打进 web 镜像的 default.conf）
server {
    listen 80;
    server_name _;

    # JSON 里内嵌 base64 文件（限 8MB）走 10m 上限即可
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css
               application/javascript
               text/javascript
               application/json
               image/svg+xml
               text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # WS：精确匹配握手路径（WS 连接恒为 GET /api/ws，查询串不参与匹配），
    # 与 /api/ 前缀并存时 = 精确匹配优先级最高。注意后端也只认 /api/ws。
    # 必须 HTTP/1.1 + Upgrade/Connection 透传，读超时放大避免空闲断连。
    location = /api/ws {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 反代：proxy_pass 不带 URI，原样透传请求路径与查询串
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 自动更新源：/updates/xxx.exe 与 /updates/latest.yml
    #
    # 必须放在 `location /` **之前**：否则 try_files 会把 /updates/latest.yml
    # 回落成 index.html，客户端拿到的是一坨 HTML 而报「更新信息解析失败」。
    #
    # 目录挂自宿主的 /opt/heming/updates（见 docker-compose.yml），
    # 不放在镜像里——安装包体积大且每次发版都换，放镜像会让构建缓存失效。
    location /updates/ {
        alias /usr/share/nginx/updates/;
        autoindex off;

        # electron-updater 靠 Content-Length 与 Range 断点续传，
        # 这两个头不能被 gzip 改写，也不该设缓存（发新版必须立刻生效）
        default_type application/octet-stream;
        add_header Cache-Control "no-store";

        # .exe 与 .blockmap 绝不能压缩：Range 响应与压缩组合会让差分更新算错哈希
        gzip off;
    }

    # SPA：真实文件直接给，其余回落 index.html（前端路由自管）
    location / {
        try_files $uri /index.html;
    }
}
