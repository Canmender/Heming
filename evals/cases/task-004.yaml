# 长任务的地基：命令必须能在后台跑，不能把一次「等 4 秒」变成一个卡住的回合。
#
# 为什么单独一条：d.164 起的 run_command 是同步的，硬超时 120 秒。
# 真实工程里的 `pnpm build`、`npm run test:e2e`、`docker build` 动辄几分钟到几十分钟，
# 同步跑法只有两种结局——占满整个回合的等待，或者超时被杀。所以 d.180 加了
# 「后台起 / 读增量 / 列表 / 停止」四件事，这条用例是它在真实模型手里的证据。
#
# 只对真实模型有意义：回放模式的 script[] 是写死的，测不出「模型会不会主动轮询」。
id: task-004
name: 起一条后台命令，轮询到输出，原样报回来
owner: evals
tags: [task, shell, long-horizon]
real_only: true
shell: true
allow_danger: true
setup:
  fixture: task-004
  roots:
    - path: "."
      mode: write
      name: work
prompt: |
  请在后台起一条命令：它等待大约 4 秒后打印 bg-done，然后退出。
  起好之后用轮询的方式读它的输出，直到看到 bg-done 为止；最后把看到的输出原样告诉我。
graders:
  - type: tool_called
    tool: run_command
  - type: tool_called
    tool: command_output
  - type: contains
    value: bg-done
    in: any
  - type: max_rounds
    max: 12
