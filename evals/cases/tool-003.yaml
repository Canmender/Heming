# 用例 tool-003：一轮并发读三份文件
# 用途：验证「一轮里一次发多个只读调用」时全部真的执行（P4/T19 的并行上限不丢调用），
#       且模型仍能按文件名顺序汇总。
# P0 期望：三次 file_read 全部执行；最终回答按 a/b/c 顺序给出标题。
# P4 说明：执行器对只读工具限 3 路并行——本用例正好压在上限上，测「排队不会漏读」。
id: tool-003
name: 一轮并发读三份文件并按顺序汇总
owner: evals
tags: [tool, capability]
setup:
  fixture: tool-003
prompt: |
  请一次发出对 a.md、b.md、c.md 的读取，然后按文件顺序告诉我三个标题。
script:
  - tool_calls:
      - name: file_read
        arguments:
          path: a.md
      - name: file_read
        arguments:
          path: b.md
      - name: file_read
        arguments:
          path: c.md
  - text: |
      三份都读到了，按顺序：a.md 是「标题 A」，b.md 是「标题 B」，c.md 是「标题 C」。
graders:
  - type: tool_called
    tool: file_read
    times: 3
  - type: contains
    value: ["标题 A", "标题 B", "标题 C"]
  - type: max_rounds
    value: 3
