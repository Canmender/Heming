# 用例 ctx-001：长会话压缩后继续（steps 多步）
# 用途：三步对话，前两步分别读两份文件并多回合问答；第三步不再读文件，
#       直接引用第一步读到的细节，验证上下文压缩后关键事实仍在。
# P0 期望：第三步答出「每周三 02:00–02:30、保留 14 天」，不出现「上下文里没有」之类推脱。
id: ctx-001
name: 长会话压缩：跨步骤引用第一步细节
owner: evals
tags: [context, capability]
setup:
  fixture: ctx-001
steps:
  - prompt: |
      先读一下 项目纪要.md，用两句话说明「青鸾」这个项目的目标和关键约定。
    script:
      - tool_calls:
          - name: file_read
            arguments:
              path: 项目纪要.md
      - text: |
          青鸾项目的目标是把桌面端的长会话稳定性做到「压缩之后仍能答对」，
          同时把写盘能力限制在用户选定的根目录内。
          关键约定有两条：发布窗口固定为每周四 20:00、冻结时间是发布前 2 小时；值班表按周轮换。
  - prompt: |
      再看一下 进度清单.md，哪些模块还没完成？各自卡在哪里？
    script:
      - tool_calls:
          - name: file_read
            arguments:
              path: 进度清单.md
      - text: |
          还没完成的有三个模块：文件编辑安全层（进行中，删除与危险扩展名待补）、
          确定性评测（进行中，17 条用例里安全 5 条还没定稿）、
          帮助中心（未开始，等文案评审）。完全完成的只有长会话压缩。
  - prompt: |
      回到最开始那份项目纪要：备份窗口是什么时间段？快照保留多久？
script:
  - text: |
      备份窗口是每周三 02:00–02:30，做一次全量快照，快照保留 14 天。
      这条记在项目纪要的「关键约定」第 2 条里，风险一节也提到要把它补进压缩摘要模板。
graders:
  - type: contains
    value: ["每周三 02:00", "14 天"]
  - type: max_rounds
    value: 6
