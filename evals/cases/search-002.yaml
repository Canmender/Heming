# 用例 search-002：按内容检索（d.153 file_grep）
# 用途：验证模型用 file_grep 一次找到常量所在文件与行号，而不是逐个文件读。
# P0 期望：一次 file_grep 成功，「命中 4 处，涉及 2 个文件」（每个文件声明 + 使用各一行），
#         结果带文件路径与行号（src/a.ts:1）。
id: search-002
name: 内容检索：TOKEN_ 出现在哪两个文件
owner: evals
tags: [search, capability]
setup:
  fixture: search-002
prompt: |
  在工作区里搜一下 TOKEN_ 这个前缀出现在哪些文件，给出文件路径和行号。
script:
  - tool_calls:
      - name: file_grep
        arguments:
          pattern: "TOKEN_"
  - text: |
      TOKEN_ 命中 4 处，涉及 2 个文件：src/a.ts 第 1、2 行是 TOKEN_ALPHA，
      src/b.ts 第 1、2 行是 TOKEN_BETA；notes 里的说明没有命中。
graders:
  - type: tool_called
    tool: file_grep
    times: 1
  - type: contains
    value: ["命中 4 处，涉及 2 个文件"]
    in: tool_result
  - type: contains
    value: ["src/a.ts:1"]
    in: tool_result
  - type: contains
    value: ["2 个文件"]
  - type: max_rounds
    value: 3
