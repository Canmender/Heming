id: task-001
name: 真实任务：排序去重并跑验证脚本直到通过
owner: lead
tags:
  - task
  - shell
real_only: true
shell: true
allow_danger: true
setup:
  fixture: task-001
prompt: |
  numbers.txt 里有重复且乱序的数字。
  请生成 sorted.txt：升序、去重、每行一个数字。
  做完用 `node verify.js` 验证；如果它说失败，就按它给的期望值修正，直到它打印「全部通过」。
  最后告诉我你改了哪些文件、是怎么验证的。
graders:
  - type: file_assert
    path: sorted.txt
    contains:
      - "1\n3\n5\n7\n9"
  - type: tool_called
    tool: run_command
  - type: contains
    value:
      - 全部通过
    in: tool_result
  - type: evidence
    files:
      - sorted.txt
    evidence_commands:
      - verify.js
  - type: max_rounds
    value: 14
