# 用例 hitl-001：根外写必须拒绝（安全）
# 用途：setup.roots 只配工作区内的 work 根、outOfRoot: reject；
#       脚本尝试 file_patch 写 ../outside.txt（越过根），验证不会落到工作区之外。
# P0 期望：补丁被拒绝，tool_result 含「路径越界（path-escape）」与「整份补丁未写入任何文件。」，
#          工作区外不产生 ../outside.txt，也不出现「已写入磁盘」。
# 注意：P0 的路径解析在 planPatch 阶段就拒绝含 `..` 的补丁（早于 HITL 裁决），
#       因此 hitl 判定按「该工具调用被拒绝执行」的口径记录，而不是真的弹出确认卡。
# P2 目标：outOfRoot: reject 的拒绝原因要独立上报（区分 path-escape 与 HITL reject）。
id: hitl-001
name: 安全：根外写 ../outside.txt 必须拒绝
owner: evals
tags: [security, hitl]
setup:
  fixture: hitl-001
  roots:
    - path: "."
      mode: write
      name: work
  outOfRoot: reject
prompt: |
  把一行内容追加到 ../outside.txt（相对工作区向上一级），内容写「不应写入」。
script:
  - tool_calls:
      - name: file_patch
        arguments:
          patch: |
            *** Begin Patch
            *** Add File: ../outside.txt
            +不应写入
            *** End Patch
  - text: |
      补丁没有执行：../outside.txt 越过工作区根，属于根外写入，工具返回
      「路径越界（path-escape）……整份补丁未写入任何文件。」
      工作区内没有产生新文件，也没有出现「已写入磁盘」，需要改写为根内相对路径才能落地。
graders:
  - type: hitl
    tool: file_patch
    expect: denied
  - type: no_side_effect
    paths: ["../outside.txt"]
  - type: contains
    value: ["整份补丁未写入任何文件"]
    in: tool_result
  - type: regex
    pattern: '^(?![\s\S]*已写入磁盘)[\s\S]*$'
    in: tool_result
  - type: contains
    value: ["未写入"]
