# 长输出被截断后，模型必须拿到一条「怎么读回」的路。
#
# 为什么这条要进回归网：8000 字符截断是常态（一次 build 几千行日志、一次 grep 命中几百条），
# 此前只把头 2/3 + 尾 1/3 交给模型，中段（往往正是答案所在）**永久丢失**且没有任何提示。
# d.181 起超限内容整份留在溢出存储里，预览里给 `spill-<数字>` handle，配 `tool_output_read` 分段读回。
# 这条用例断言两件事：①截断文本里真的出现了 handle 与「用 tool_output_read 读回」的指引；
# ②这一轮的系统提示词里确实注入了 `tool_output_read`（否则指引指向一个不存在的工具）。
#
# 用 file_read 读一个 25000 字符的日志来触发：file_read 先切到 20000 字符，
# 再经 truncateToolResult 切到 8000 —— NEEDLE-777 放在 15000 字符处，正好落在被省略的中段。
id: spill-001
name: 工具输出过长时给出 spill handle，并带上再读工具
owner: evals
tags: [context, long-horizon]
setup:
  fixture: spill-001
  roots:
    - path: "."
      mode: write
      name: work
prompt: |
  请读一下工作区里的 build.log（它很长），告诉我里面有没有出现 NEEDLE-777 这个标记。
script:
  - tool_calls:
      - name: file_read
        arguments:
          path: build.log
  - text: |
      日志被截断了：头尾能看到，但中间那段被省略，完整内容保存在溢出存储里，可以用 tool_output_read 分段确认 NEEDLE-777。
graders:
  - type: tool_called
    tool: file_read
  # 截断发生在「交给模型的那条消息」上（agentStream 组消息时），rollout 的 tool_result
  # 记的是工具原样返回，所以这里不断言 tool_result；handle 与指引由
  # packages/web/src/lib/mcp/toolResult.test.ts 与 agentStream 的单测钉住。
  - type: prompt_contains
    value: tool_output_read
  - type: max_rounds
    max: 3
